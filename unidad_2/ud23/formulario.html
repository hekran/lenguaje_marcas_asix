<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <form action="#" method="post" enctype="multipart/form-data">
        <h2>Formulario de alta de usuario</h2>
        <table>
            <tr>
                <td colspan="2">
                    <label for="user">Identificador de nuevo usuario</label>
                    <input type="text" id="user" name="usuario" readonly value="usu_012345">
                </td>
            
            </tr>
            <tr>
                <td>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" title="Introduce tu nombre">
                </td>
                <td>
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" title="Introduce tus apellidos">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="pass">Contraseña:</label>
                    <input type="password" id="pass" name="contraseña" title="Introduce tu contraseña">
                </td>
                <td>
                    <label for="cpass">Confirmar contraseña:</label>
                    <input type="password" id="cpass" name="ccontraseña" title="Confirma contraseña">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" title="Introduce tu email" size="45">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Sexo:</label>
                </td>
                <td>
                    <input type="radio" id="sexoh" name="sexo" title="Elige tu sexo"><label class="fnormal" for="sexoh">Hombre</label>
                    <input type="radio" id="sexom" checked name="sexo" title="Elige tu sexo"><label class="fnormal" for="sexom">Mujer</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label>Aficiones:</label>
                </td>
                <td>
                    <input type="checkbox" name="deportes" id="deportes"><label class="fnormal" for="deportes">Deportes</label><br>
                    <input type="checkbox" name="lectura" id="lectura" checked><label class="fnormal" for="lectura">Lectura</label><br>
                    <input type="checkbox" name="cine" id="cine"><label class="fnormal" for="cine">Cine</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="paises">Pais:</label>
                </td>
                <td>
                    <select name="pais" id="paises" title="Selecciona tu Pais">
                        <option value="españa" selected title="Estás seleccionando España">España</option>
                        <option value="francia" title="Estás seleccionando Francia">Francia</option>
                        <option value="portugal" title="Estás seleccionando Portugal">Portugal</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="foto">Subir su foto</label>
                </td>
                <td>
                    <input type="file" id="foto" name="imagen" accept="image/*">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="comen">Comentarios personales:</label>
                </td>
                <td>
                    <textarea name="comentarios" id="comen" placeholder="Escriba aquí sus comentarios" cols="40" rows="5"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="reset" value="Resetear">
                </td>
                <td>
                    <input type="submit" value="Enviar">
                </td>
            </tr>   
        </table>
    </form>
</body>
</html>
