<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="16" height="16">
  <!-- Círculos concéntricos del borde -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#4a0e0e" stroke-width="4"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#4a0e0e" stroke-width="4"/>

  <!-- Números binarios -->
  <g fill="#d4380d" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" text-anchor="middle">
    <!-- Fila superior -->
    <text x="30" y="44">0</text>
    <text x="50" y="44">1</text>
    <text x="70" y="44">0</text>
    
    <!-- Fila inferior -->
    <text x="30" y="72">1</text>
    <text x="50" y="72">0</text>
    <text x="70" y="72">1</text>
  </g>
</svg>
