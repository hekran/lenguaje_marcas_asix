<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <form action="http://172.30.18.224:3000" method="post" enctype="multipart/form-data">
        <h2>Formulario de alta de usuario</h2>
        <table>
            <tr>
                <td colspan="2">
                    <label for="user">Identificador de nuevo usuario</label>
                    <input type="text" id="user" name="usuario" readonly value="usu_012345">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" title="Introduce tu nombre" required>
                </td>
                <td>
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" title="Introduce tus apellidos">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="pass">Contraseña:</label>
                    <input type="password" id="pass" name="password" title="Introduce tu contraseña" required>
                </td>
                <td>
                    <label for="cpass">Confirmar contraseña:</label>
                    <input type="password" id="cpass" name="password2" title="Confirma contraseña" required>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" title="Introduce tu email" size="50">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Sexo:</label>
                </td>
                <td>
                    <input type="radio" id="sexoh" name="sexo" title="Elige tu sexo" value="hombre"><label class="fnormal" class="fnormal" for="sexoh">Hombre</label>
                    <input type="radio" id="sexom" checked name="sexo" title="Elige tu sexo" value="mujer"><label class="fnormal" class="fnormal" for="sexom">Mujer</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label>Aficiones:</label>
                </td>
                <td>
                    <input type="checkbox" name="aficiones" id="deportes" value="deportes"><label class="fnormal" class="fnormal" for="deportes" title="está seleccionando Deportess">Deportes</label><br>
                    <input type="checkbox" name="aficiones" id="lectura" checked value="Lectura"><label class="fnormal" class="fnormal" for="lectura" title="está seleccionando Lectura">Lectura</label><br>
                    <input type="checkbox" name="aficiones" id="cine" value="Cine"><label class="fnormal" class="fnormal" for="cine" title="está seleccionando Lectura">Cine</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="paises">Pais:</label>
                </td>
                <td>
                    <select name="pais" id="paises" title="Selecciona tu Pais">
                        <option value="españa" selected title="Estás seleccionando España">España</option>
                        <option value="francia" title="Estás seleccionando Francia">Francia</option>
                        <option value="portugal" title="Estás seleccionando Portugal">Portugal</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="foto">Subir su foto</label>
                </td>
                <td>
                    <input type="file" id="foto" name="foto" accept="image/*" title="Adjunte su imagen">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="comen">Comentarios personales:</label>
                </td>
                <td>
                    <textarea name="comentarios" id="comen" placeholder="Escriba aquí sus comentarios" cols="40" rows="5" title="Escriba sus observaciones"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="promo">Código promocional</label>
                </td>
                <td>
                    <input type="text" id="promo" name="promo" title="Introduce tu código Promocional" disabled value="Asax2231">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="reset" value="Resetear">
                </td>
                <td>
                    <input type="submit" value="Enviar">
                </td>
            </tr>   
        </table>
    </form>
</body>
</html>
