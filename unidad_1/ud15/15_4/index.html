<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Tabla completa</title>
        <style>
            table,tr,th,td {
                border: 1px solid black;
            }
            table {
                empty-cells: hide;
            }
            /* Empty cells oculta la celdas vacias bordes incluidos, así no haría falta quitar los bordes celda por celda */
        </style>
    </head>
    <body>
        <table style="margin: 0 auto; border-spacing: 8px 4px;">
            <caption style="caption-side: bottom;">COCHES</caption>
            <thead>
                <tr>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Color</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2" style="vertical-align: top;">Renault</td>
                    <td>Twingo</td>
                    <td>Rojo</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td>Megane</td>
                    <td>Amarillo</td>
                    <td>5</td>
                </tr>
                <tr>
                    <td rowspan="3">Nissan</td>
                    <td>Micra</td>
                    <td>Negro</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>Juke</td>
                    <td>Rojo</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>Qashqai</td>
                    <td>Blanco</td>
                    <td>7</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th>Total</th>
                    <td></td>
                    <td></td>
                    <td>18</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
