<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Horario semanal</title>
        <style>
            table, th, td {
                border-collapse: collapse;
                border: 1px solid black;
                text-align: center;
            }
            th {
                background-color: rgb(187, 187, 234);
            }
        </style>
    </head>
    <body>
        <table>
            <caption>Horario Semanal</caption>
            <tr>
                <th></th>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
            <tr>
                <th>15:00 - 15:55</th>
                <td>ISO</td>
                <td>ISO</td>
                <td>ISO</td>
                <td>ISO</td>
                <td>GBD</td>
            </tr>
            <tr>
                <th>15:55 - 16:50</th>
                <td>ISO</td>
                <td>PAR</td>
                <td>ISO</td>
                <td>IP</td>
                <td>PAR</td>
            </tr>
            <tr>
                <th>16:50 - 17:45</th>
                <td>ISO</td>
                <td>PAR</td>
                <td>LM</td>
                <td>GBD</td>
                <td>PAR</td>
            </tr>
            <tr>
                <th>18:05 - 19:00</th>
                <td>GBD</td>
                <td>GBD</td>
                <td>PAR</td>
                <td>GBD</td>
                <td>FH</td>
            </tr>
            <tr>
                <th>19:00 - 19:55</th>
                <td>FH</td>
                <td>IP</td>
                <td>PAR</td>
                <td>IPE</td>
                <td>PAI</td>
            </tr>
            <tr>
                <th>19:55 - 20:50</th>
                <td>FH</td>
                <td>LM</td>
                <td>IPE</td>
                <td>LM</td>
                <td>IPE</td>
            </tr>
        </table>
    </body>
</html>
